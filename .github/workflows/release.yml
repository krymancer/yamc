# Push a tag like v0.2.0 (scripts/release.sh does it) to publish yamc-macos.zip as a GitHub
# release. Installed copies of yamc pick it up on their next update check.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/yamc/Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but crates/yamc is $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked -p yamc-core --lib --test store

      # Sign with the release certificate so updates keep one identity (Keychain access sticks)
      # and the in-app updater accepts them. It's self-made, so macOS doesn't need to trust it.
      - name: Load signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/signing.p12"

      - run: scripts/bundle-macos.sh
        env:
          SIGN_IDENTITY: 45E72C5F7F55C6F323D6C533AF45C3BCF0F7D773

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/yamc-macos.zip --title "yamc ${GITHUB_REF_NAME#v}" --generate-notes
